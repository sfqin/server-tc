name: Probe Miao production

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      expected_ips_override:
        description: Optional public IP allowlist override for acceptance testing
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: miao-production-external-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out probe code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run probe tests
        run: python3 -m unittest discover -s tests -v

      - name: Restore incident state
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .probe-state
          key: ${{ runner.os }}-miao-production-probe-v1-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-miao-production-probe-v1-

      - name: Prepare private state directory
        run: install -d -m 0700 .probe-state

      - name: Probe twice and deliver alerts
        id: probe
        continue-on-error: true
        env:
          MIAO_PRODUCTION_EXPECTED_IPS: ${{ inputs.expected_ips_override || vars.MIAO_PRODUCTION_EXPECTED_IPS || secrets.MIAO_PRODUCTION_EXPECTED_IPS }}
          MIAO_PROBE_FEISHU_WEBHOOK_URL: ${{ secrets.MIAO_PROBE_FEISHU_WEBHOOK_URL }}
          MIAO_PROBE_FEISHU_SECRET: ${{ secrets.MIAO_PROBE_FEISHU_SECRET }}
          MIAO_PROBE_STATE_PATH: ${{ github.workspace }}/.probe-state/production.json
        run: |
          set +e
          python3 production_probe.py
          FIRST_RESULT=$?
          sleep 10
          python3 production_probe.py
          SECOND_RESULT=$?
          set -e

          FINAL_RESULT="$SECOND_RESULT"
          if [ "$FIRST_RESULT" -eq 2 ] || [ "$SECOND_RESULT" -eq 2 ]; then
            FINAL_RESULT=2
          fi
          printf 'exit_code=%s\n' "$FINAL_RESULT" >> "$GITHUB_OUTPUT"
          exit "$FINAL_RESULT"

      - name: Save incident state
        if: always() && steps.probe.outcome != '' && steps.probe.outputs.exit_code != '2'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .probe-state
          key: ${{ runner.os }}-miao-production-probe-v1-${{ github.run_id }}

      - name: Preserve probe failure result
        if: always() && steps.probe.outcome == 'failure'
        run: exit 1
